<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/main.js"></script>
  </head>
  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider">
      <div class="hero">
        <img
          src="/images/banner-sm.jpg"
          srcset="/images/banner-sm.jpg 500w, /images/banner.jpg"
          alt="A high mountain lake surrounded by trees"
        />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="Tent logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>

      <section class="product-categories" aria-labelledby="category-title">
        <h2 id="category-title">Shop by Category</h2>
        <div class="category-list">
          <a class="category-card" href="/product_listing/?category=tents">
            <img src="/images/category-tents.svg" alt="" />
            <span>Tents</span>
          </a>
          <a class="category-card" href="/product_listing/?category=backpacks">
            <img src="/images/category-backpacks.svg" alt="" />
            <span>Backpacks</span>
          </a>
          <a
            class="category-card"
            href="/product_listing/?category=sleeping-bags"
          >
            <img src="/images/category-sleepingbags.svg" alt="" />
            <span>Sleeping Bags</span>
          </a>
          <a class="category-card" href="/product_listing/?category=hammocks">
            <img src="/images/category-hammocks.svg" alt="" />
            <span>Hammocks</span>
          </a>
        </div>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
