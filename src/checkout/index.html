<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>
  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <h2>Review & Place Your Order</h2>
      <form name="checkout" id="checkoutForm">
        <fieldset>
          <legend>Shipping</legend>
          <label for="fname">First Name</label>
          <input type="text" id="fname" name="fname" required />

          <label for="lname">Last Name</label>
          <input type="text" id="lname" name="lname" required />

          <label for="street">Street Address</label>
          <input type="text" id="street" name="street" required />

          <label for="city">City</label>
          <input type="text" id="city" name="city" required />

          <label for="state">State</label>
          <input type="text" id="state" name="state" required />

          <label for="zip">Zip Code</label>
          <input type="text" id="zip" name="zip" required />
        </fieldset>

        <fieldset>
          <legend>Payment</legend>
          <label for="cardNumber">Card Number</label>
          <input type="text" id="cardNumber" name="cardNumber" required />

          <label for="expiration">Expiration Date (MM/YY)</label>
          <input type="text" id="expiration" name="expiration" required />

          <label for="code">Security Code (CVV)</label>
          <input type="text" id="code" name="code" required />
        </fieldset>

        <fieldset class="checkout-summary">
          <legend>Order Summary</legend>
          <ul>
            <li>
              <label for="cartTotal">Item Subtotal:</label>
              <span id="cartTotal">$0.00</span>
            </li>
            <li>
              <label for="shipping">Shipping Estimate:</label>
              <span id="shipping">$0.00</span>
            </li>
            <li>
              <label for="tax">Tax:</label>
              <span id="tax">$0.00</span>
            </li>
            <li>
              <label for="orderTotal">Order Total:</label>
              <span id="orderTotal">$0.00</span>
            </li>
          </ul>
        </fieldset>

        <button id="checkoutSubmit" type="submit">Checkout</button>
      </form>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
